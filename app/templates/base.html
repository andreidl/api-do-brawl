<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}API do Brawl{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilo.css?v={{ css_ver() }}">
</head>
<body>
  <header>
    <a href="/" class="marca">⭐ API do Brawl</a>
    <nav class="menu">
      <a href="/cla">🐍 Clã</a>
      <a href="/brawler">📊 Meta</a>
      <a href="/comparar">⚖️ Comparar</a>
    </nav>
  </header>
  <main class="{% block main_classe %}{% endblock %}">{% block conteudo %}{% endblock %}</main>
  <script>
  // Ordenação genérica: clicar em qualquer cabeçalho de tabela ordena por aquela
  // coluna (numérica ou texto, detectado automaticamente). Usa data-sort/data-val
  // da célula quando existir.
  function _valOrd(td) {
    const dv = td.dataset.sort !== undefined ? td.dataset.sort : td.dataset.val;
    if (dv !== undefined) { const n = parseFloat(dv); return isNaN(n) ? null : n; }
    const s = td.textContent.replace(/\s/g, '');
    const m = s.match(/-?[\d.,]+/);
    if (!m) return null;
    let num = m[0];
    if (num.includes(',')) num = num.replace(/\./g, '').replace(',', '.');
    else if (/\.\d{3}$/.test(num) && !s.includes('%')) num = num.replace(/\./g, '');
    const v = parseFloat(num);
    return isNaN(v) ? null : v;
  }
  function _ordenar(tabela, col, th) {
    const tbody = tabela.tBodies[0]; if (!tbody) return;
    const linhas = Array.from(tbody.rows).filter(r => r.cells.length > col);
    const asc = tabela.dataset.ordCol == col && tabela.dataset.ordDir === 'desc';
    const numerico = linhas.filter(r => _valOrd(r.cells[col]) !== null).length >= linhas.length / 2;
    linhas.sort((a, b) => {
      if (numerico) {
        const va = _valOrd(a.cells[col]), vb = _valOrd(b.cells[col]);
        return asc ? (va ?? -Infinity) - (vb ?? -Infinity) : (vb ?? -Infinity) - (va ?? -Infinity);
      }
      const ta = a.cells[col].textContent.trim(), tb = b.cells[col].textContent.trim();
      return asc ? ta.localeCompare(tb, 'pt') : tb.localeCompare(ta, 'pt');
    });
    tabela.dataset.ordCol = col; tabela.dataset.ordDir = asc ? 'asc' : 'desc';
    Array.from(th.parentNode.cells).forEach(c => c.classList.remove('ord-asc', 'ord-desc'));
    th.classList.add(asc ? 'ord-asc' : 'ord-desc');
    // renumera a 1ª coluna se for um índice "#"
    const primeiroTh = tabela.tHead && tabela.tHead.rows[0] && tabela.tHead.rows[0].cells[0];
    const ehIndice = primeiroTh && primeiroTh.textContent.trim() === '#';
    linhas.forEach((l, i) => { if (ehIndice) l.cells[0].textContent = i + 1; tbody.appendChild(l); });
  }
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('table').forEach(tabela => {
      const thead = tabela.tHead; if (!thead || !thead.rows[0]) return;
      Array.from(thead.rows[0].cells).forEach((th, col) => {
        th.classList.add('th-ord');
        th.addEventListener('click', () => _ordenar(tabela, col, th));
      });
    });
  });

  // Accordion de seções (só em main.acordeon, ex.: página do jogador): cada <h2>
  // vira um cabeçalho clicável que abre/fecha o conteúdo até o próximo <h2>.
  (function () {
    const main = document.querySelector('main.acordeon');
    if (!main) return;
    const h2s = Array.from(main.children).filter(el => el.tagName === 'H2');
    h2s.forEach((h2, i) => {
      const corpo = document.createElement('div');
      corpo.className = 'secao-corpo';
      let el = h2.nextElementSibling;
      while (el && el.tagName !== 'H2') { const prox = el.nextElementSibling; corpo.appendChild(el); el = prox; }
      h2.after(corpo);
      h2.classList.add('secao-h');
      h2._corpo = corpo;
      if (i > 0) { corpo.hidden = true; h2.classList.add('fechada'); }
      h2.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') return;
        corpo.hidden = !corpo.hidden;
        h2.classList.toggle('fechada', corpo.hidden);
      });
    });
    function abrirAlvo() {
      const id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      const alvo = document.getElementById(id);
      if (!alvo) return;
      const h2 = alvo.classList.contains('secao-h') ? alvo
        : (alvo.closest('.secao-corpo') ? alvo.closest('.secao-corpo').previousElementSibling : null);
      if (h2 && h2._corpo) { h2._corpo.hidden = false; h2.classList.remove('fechada'); }
      alvo.scrollIntoView();
    }
    window.addEventListener('hashchange', abrirAlvo);
    abrirAlvo();
  })();
  </script>
</body>
</html>
